# OPTIONAL public access through a Cloudflare Tunnel (never run automatically). Nothing is published on this machine's
# network: cloudflared makes an outbound connection to Cloudflare and Cloudflare forwards visitors to http://web:3000.
#   docker compose -f docker-compose.yml -f docker-compose.tunnel.yml up -d --build
# Requires in .env: CLOUDFLARE_TUNNEL_TOKEN (from the Cloudflare dashboard), APP_URL=https://<your hostname>,
# INVITE_CODE=<long random>. Full steps: docs/DEPLOY_CLOUDFLARE.md
services:
  web:
    ports: !reset []
    environment:
      APP_URL: ${APP_URL:?set APP_URL to the https:// address of the tunnel hostname}
      INVITE_CODE: ${INVITE_CODE:?set INVITE_CODE so registration is invite-only}
      ALLOW_PRIVATE_AI_ENDPOINTS: "false"

  cloudflared:
    image: cloudflare/cloudflared:2025.11.1
    restart: unless-stopped
    depends_on: [web]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN}
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [internal]
