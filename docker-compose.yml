# Local, private use:  cp .env.example .env  (set the three secrets)  →  docker compose up --build
# Only the web app is reachable, and only from this machine (127.0.0.1). The database and the
# worker are on an internal network with no published ports.
services:
  db:
    mem_limit: 1g
    pids_limit: 128
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: klierly
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: klierly
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U klierly -d klierly"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [backend]

  worker:
    mem_limit: 1g
    cpus: 1.5
    pids_limit: 128
    build: ./worker
    restart: unless-stopped
    environment:
      WORKER_TOKEN: ${WORKER_TOKEN:?set WORKER_TOKEN in .env}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-25}
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [backend]

  # OPTIONAL, off unless COMPOSE_PROFILES=solver: runs AI-written solver code for Learn Mode calculation questions.
  # It is a separate container from the parsing worker, with its own token, on its own network that contains only
  # this service and the web app. That network is internal (no route to the internet) and does not include the
  # database, so a solver that misbehaves can reach neither. Only /health and /sandbox/run are served.
  solver:
    profiles: ["solver"]
    mem_limit: 1g
    cpus: 1
    pids_limit: 64
    build: ./worker
    restart: unless-stopped
    environment:
      WORKER_ROLE: solver
      WORKER_TOKEN: ${SOLVER_TOKEN:?set SOLVER_TOKEN in .env (a different secret from WORKER_TOKEN)}
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [solver-net]

  web:
    mem_limit: 2g
    cpus: 1.5
    pids_limit: 256
    build:
      context: .
      dockerfile: web/Dockerfile
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
      worker: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://klierly:${POSTGRES_PASSWORD}@db:5432/klierly
      APP_SECRET: ${APP_SECRET:?set APP_SECRET in .env}
      APP_URL: ${APP_URL:-http://localhost:3000}
      WORKER_URL: http://worker:8001
      WORKER_TOKEN: ${WORKER_TOKEN}
      # Set both (and COMPOSE_PROFILES=solver) to enable calculation questions in Learn Mode. Empty = conceptual questions only.
      WORKER_SOLVER_URL: ${WORKER_SOLVER_URL:-}
      WORKER_SOLVER_TOKEN: ${SOLVER_TOKEN:-}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-25}
      INVITE_CODE: ${INVITE_CODE:-}
      TZ: ${TZ:-America/New_York}
      TRUST_CLOUDFLARE: ${TRUST_CLOUDFLARE:-false}
      MANAGED_AI_BASE_URL: ${MANAGED_AI_BASE_URL:-}
      MANAGED_AI_API_KEY: ${MANAGED_AI_API_KEY:-}
      MANAGED_AI_MODEL: ${MANAGED_AI_MODEL:-}
      MANAGED_AI_MODEL_STRONG: ${MANAGED_AI_MODEL_STRONG:-}
      MANAGED_AI_USER_DAILY_REQUESTS: ${MANAGED_AI_USER_DAILY_REQUESTS:-40}
      MANAGED_AI_USER_MONTHLY_TOKENS: ${MANAGED_AI_USER_MONTHLY_TOKENS:-400000}
      MANAGED_AI_GLOBAL_DAILY_REQUESTS: ${MANAGED_AI_GLOBAL_DAILY_REQUESTS:-500}
      MANAGED_AI_GLOBAL_MONTHLY_USD: ${MANAGED_AI_GLOBAL_MONTHLY_USD:-10}
      MANAGED_AI_PRICE_IN_PER_MTOK: ${MANAGED_AI_PRICE_IN_PER_MTOK:-}
      MANAGED_AI_PRICE_OUT_PER_MTOK: ${MANAGED_AI_PRICE_OUT_PER_MTOK:-}
      MANAGED_AI_STRONG_PRICE_IN_PER_MTOK: ${MANAGED_AI_STRONG_PRICE_IN_PER_MTOK:-}
      MANAGED_AI_STRONG_PRICE_OUT_PER_MTOK: ${MANAGED_AI_STRONG_PRICE_OUT_PER_MTOK:-}
      ALLOW_PRIVATE_AI_ENDPOINTS: ${ALLOW_PRIVATE_AI_ENDPOINTS:-true}
    volumes:
      - uploads:/data/uploads
    ports:
      - "127.0.0.1:3000:3000"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [backend, edge, solver-net]

volumes:
  db-data:
  uploads:

networks:
  backend:
    internal: true
  solver-net:
    internal: true
  edge:
