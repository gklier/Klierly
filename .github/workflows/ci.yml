name: CI

on:
  pull_request:
  push:
    branches: [main, public-preview]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  worker:
    name: Worker (parsing and numerics)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: worker } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip, cache-dependency-path: worker/requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
        env: { WORKER_TOKEN: ci-worker-token }

  extension:
    name: Extension unit tests
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: extension } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm test
      - run: npm run package

  web:
    name: Web (types, lint, integration, end-to-end)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: klierly, POSTGRES_PASSWORD: klierly_ci, POSTGRES_DB: klierly }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U klierly" --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      DATABASE_URL: postgres://klierly:klierly_ci@127.0.0.1:5432/klierly
      APP_SECRET: ci-only-secret-not-used-anywhere-else-0123456789abcdef
      WORKER_URL: http://127.0.0.1:8001
      WORKER_TOKEN: ci-worker-token
      APP_URL: http://localhost:3000
      TZ: America/New_York
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip, cache-dependency-path: worker/requirements.txt }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }

      - name: Start the worker
        working-directory: worker
        run: |
          pip install -r requirements.txt
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8001 --no-access-log > worker.log 2>&1 &
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8001/health && break; sleep 1; done

      - name: Test databases
        run: |
          PGPASSWORD=klierly_ci psql -h 127.0.0.1 -U klierly -d klierly -c "create database klierly_test"
          PGPASSWORD=klierly_ci psql -h 127.0.0.1 -U klierly -d klierly -c "alter role klierly createdb"

      - name: Install
        working-directory: web
        run: |
          npm ci
          printf 'DATABASE_URL=%s\nAPP_SECRET=%s\nAPP_URL=%s\nWORKER_URL=%s\nWORKER_TOKEN=%s\nTZ=%s\n' "$DATABASE_URL" "$APP_SECRET" "$APP_URL" "$WORKER_URL" "$WORKER_TOKEN" "$TZ" > .env.local

      - { name: Type check, working-directory: web, run: npm run typecheck }
      - { name: Lint, working-directory: web, run: npm run lint }
      - { name: Dependency audit (shipped code), working-directory: web, run: npm audit --omit=dev --audit-level=high }
      - { name: Unit and integration tests, working-directory: web, run: npm test }

      - name: End-to-end tests (production build, Chromium with the extension loaded)
        working-directory: web
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e

      - name: Keep failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            web/test-results
            worker/worker.log
          retention-days: 7

  docker:
    name: Docker images build and the stack starts (x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Settings for a throwaway test stack
        run: |
          printf 'POSTGRES_PASSWORD=%s\nWORKER_TOKEN=%s\nAPP_SECRET=%s\nAPP_URL=http://localhost:3000\n' "$(openssl rand -hex 16)" "$(openssl rand -hex 24)" "$(openssl rand -base64 48 | tr -d '\n')" > .env
      - name: Build and start (waits for every health check)
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Health
        run: curl -fsS http://localhost:3000/api/health
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail 120
      - run: docker compose down -v

  docker-arm64:
    # Oracle's free machines are Arm. This builds and starts the same stack under emulation to catch
    # Arm-only problems. Slow (it compiles under QEMU), so it runs on main and when started by hand.
    name: Docker stack on linux/arm64 (emulated)
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with: { platforms: arm64 }
      - name: Settings for a throwaway test stack
        run: |
          printf 'POSTGRES_PASSWORD=%s\nWORKER_TOKEN=%s\nAPP_SECRET=%s\nAPP_URL=http://localhost:3000\n' "$(openssl rand -hex 16)" "$(openssl rand -hex 24)" "$(openssl rand -base64 48 | tr -d '\n')" > .env
      - name: Build and start on arm64
        env: { DOCKER_DEFAULT_PLATFORM: linux/arm64 }
        run: docker compose up -d --build --wait --wait-timeout 900
      - name: Confirm it is really arm64, and healthy
        run: |
          docker compose exec -T worker uname -m
          curl -fsS http://localhost:3000/api/health
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail 150
      - run: docker compose down -v

  secrets:
    name: No secrets or student data in Git
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tracked files must not include env files, uploads or database files
        run: |
          bad=$(git ls-files | grep -E '(^|/)\.env($|\.)|(^|/)data/|\.sqlite3?$|\.dump$|(^|/)uploads/' | grep -v '\.env\.example$' || true)
          if [ -n "$bad" ]; then echo "Forbidden files tracked:"; echo "$bad"; exit 1; fi
      - name: No credential-shaped strings
        # Test folders are excluded: they contain obvious dummy keys used to test redaction.
        run: |
          if git grep -nIE '(sk-[A-Za-z0-9]{20,}|clx_[A-Za-z0-9_-]{30,}|-----BEGIN (RSA |EC )?PRIVATE KEY-----)' -- . ':!*.md' ':!web/package-lock.json' ':!web/tests' ':!web/e2e'; then
            echo "Possible secret committed"
            exit 1
          fi
